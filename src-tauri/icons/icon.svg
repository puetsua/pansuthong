<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Tag Tick App Icon</title>
  <desc>A simple purple app icon with a white tag and purple check mark, designed for clarity at small sizes.</desc>

  <defs>
    <linearGradient id="bg" x1="160" y1="120" x2="864" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9B4DFF"/>
      <stop offset="1" stop-color="#4B1AAE"/>
    </linearGradient>
    <linearGradient id="tag" x1="326" y1="230" x2="698" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1E8FF"/>
    </linearGradient>
    <filter id="shadow" x="238" y="184" width="548" height="680" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#2B0B62" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>

  <!-- Main tag shape -->
  <g filter="url(#shadow)">
    <path d="M512 196
             C538 196 563 206 582 224
             L734 376
             C754 396 765 424 765 452
             V708
             C765 774 711 828 645 828
             H379
             C313 828 259 774 259 708
             V452
             C259 424 270 396 290 376
             L442 224
             C461 206 486 196 512 196Z" fill="url(#tag)"/>
  </g>

  <!-- Tag hole -->
  <circle cx="512" cy="337" r="54" fill="#5B20BF"/>

  <!-- Check mark -->
  <path d="M396 552 L489 645 L651 483" stroke="#7A35E8" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
