<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pansutong">
  <defs>
    <!-- indigo -> deep violet tile: the gold+purple identity -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B53F0"/>
      <stop offset="1" stop-color="#4326B0"/>
    </linearGradient>
    <!-- soft top-left light for depth -->
    <radialGradient id="sheen" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- golden star fill -->
    <linearGradient id="gold" x1="0.15" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#EA8C0B"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect width="512" height="512" rx="114" fill="url(#sheen)"/>

  <!-- Gold 5-pointed star, centered (cx=256 cy=262, R=180 r=74) -->
  <path d="M256 82
    L298.5 199.9 L427.2 202.5 L324.5 280.6 L361.8 401.6
    L256 332.4 L150.2 401.6 L187.5 280.6 L84.8 202.5 L213.5 199.9 Z"
    fill="url(#gold)" stroke="#B45309" stroke-width="6" stroke-linejoin="round"/>

  <!-- Purple checkmark nested in the star body -->
  <path d="M206 262 L242 302 L320 214"
    fill="none" stroke="#4326B0" stroke-width="30"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
