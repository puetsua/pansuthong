[package]
name = "pansutong"
version = "0.1.0"
description = "Pansuthong - cross-platform task tracker"
authors = ["you"]
edition = "2021"
license = "CC-BY-NC-4.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pansutong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
notify = "6"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
# Dev-only MCP bridge (registered under #[cfg(debug_assertions)] in lib.rs).
# Lets Cursor/Claude drive the running app via @hypothesi/tauri-mcp-server.
tauri-plugin-mcp-bridge = "0.12"
# Durable store. `bundled` compiles SQLite into the binary so there is no system
# dependency and it links the same way for desktop and the aarch64-linux-android
# target (verify Android locally: `cargo check --target aarch64-linux-android`).
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
# In-app updater (desktop only — the updater has no Android/iOS support, and
# keeping these off the mobile target avoids leaking their permissions into the
# shared Android ACL build).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "28"

