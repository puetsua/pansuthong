name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the Release workflow reuse these checks as a pre-release gate.
  workflow_call:

jobs:
  frontend:
    name: Frontend (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    name: Rust (clippy · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    name: Android (compile check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      # The desktop CI never compiles the Android target, so an #[cfg(target_os =
      # "android")] regression (e.g. the SAF sync paths) only surfaces at release
      # time. `cargo check` compiles the cdylib lib for Android without linking, so
      # it needs no NDK and stays a fast gate that catches those breaks early.
      - run: cargo check --manifest-path src-tauri/Cargo.toml --lib --target aarch64-linux-android

  build:
    name: Build (desktop smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `tauri build` runs the frontend build (npm run build) via
      # beforeBuildCommand, so this compiles both the React bundle and the
      # desktop binary. --no-bundle skips installer packaging — a fast
      # smoke-check that the app still builds end to end.
      - run: npm run tauri build -- --no-bundle
