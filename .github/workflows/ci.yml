name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the Release workflow reuse these checks as a pre-release gate.
  workflow_call:

jobs:
  frontend:
    name: Frontend (lint · types · tests)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    name: Rust (clippy · tests)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  android:
    name: Android (compile check)
    runs-on: [self-hosted, linux]
    env:
      # Same NDK pin as release.yml so bundled rusqlite (libsqlite3-sys) can
      # compile its C sources for aarch64-linux-android during `cargo check`.
      NDK_VERSION: "28.2.13676358"
      # API level for the NDK clang triple; matches typical Tauri Android mins.
      ANDROID_API: "24"
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      # Host build scripts (cc-rs / libsqlite3-sys) need a C toolchain even when
      # the final link is for Android.
      - name: Install host C toolchain
        run: sudo apt-get install -y build-essential
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Point cc-rs at NDK clang for aarch64-linux-android
        run: |
          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64-linux-android=${TOOLCHAIN}/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64-linux-android=${TOOLCHAIN}/llvm-ar" >> "$GITHUB_ENV"
          echo "CFLAGS_aarch64-linux-android=--target=aarch64-linux-android${ANDROID_API}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      # Catches #[cfg(target_os = "android")] regressions (e.g. SAF sync) and
      # verifies the bundled SQLite C build for the Android target before release.
      - run: cargo check --manifest-path src-tauri/Cargo.toml --lib --target aarch64-linux-android

  build:
    name: Build (desktop smoke)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `tauri build` runs the frontend build (npm run build) via
      # beforeBuildCommand, so this compiles both the React bundle and the
      # desktop binary. --no-bundle skips installer packaging — a fast
      # smoke-check that the app still builds end to end.
      - run: npm run tauri build -- --no-bundle
