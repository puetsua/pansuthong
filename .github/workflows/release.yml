name: Release

# Push a plain semver tag (e.g. `0.0.0`, `0.1.0`, or a `0.0.0-beta.1` prerelease)
# to build the Windows desktop installer and the Android APK and publish them to
# a GitHub Release for that tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # create the release and upload artifacts

jobs:
  # Generate the release notes first and seed the GitHub Release with them, so the
  # build jobs only append artifacts (action-gh-release leaves an existing body
  # untouched when `body` is omitted).
  release-notes:
    name: Release notes (git-cliff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git-cliff can build the changelog

      # Render the notes for the just-pushed tag (`--latest`) from cliff.toml.
      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Seed the release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.cliff.outputs.content }}

  windows-desktop:
    name: Windows desktop (NSIS .exe)
    needs: release-notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The tag is the source of truth for the version; stamp it into the
      # configs so the installer is named correctly. Build-time only.
      - name: Sync version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: node .github/scripts/set-version.mjs "$env:VERSION"

      # NSIS .exe only (skip the WiX .msi).
      - run: npm run tauri build -- --bundles nsis

      - name: Publish .exe to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*-setup.exe

  android:
    name: Android (unsigned APK)
    needs: release-notes
    runs-on: ubuntu-latest
    env:
      # Pin the NDK that the local toolchain is known good with.
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages + NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Sync version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: node .github/scripts/set-version.mjs "$VERSION"

      # Decode the release keystore from secrets and point the Gradle signing
      # config at it (see src-tauri/gen/android/app/build.gradle.kts).
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          EOF

      - run: npm run tauri android build -- --apk

      # Stage the signed APK under a versioned name matching the desktop installer.
      - name: Stage APK with versioned name
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist-apk
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
             "dist-apk/Pansutong_${VERSION}_universal.apk"

      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist-apk/*.apk
