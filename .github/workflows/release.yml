name: Release

# Push a plain semver tag (e.g. `0.0.0`, `0.1.0`, or a `0.0.0-beta.1` prerelease)
# to build the Windows desktop installer and the Android APK and publish them to
# a GitHub Release for that tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # create the release and upload artifacts

jobs:
  # Gate the whole release on the CI suite (lint · types · tests · clippy · build
  # smoke). If anything fails, no release is seeded and no artifacts are built or
  # published — don't release failed stuff.
  tests:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  # Generate the release notes first and seed the GitHub Release with them, so the
  # build jobs only append artifacts (action-gh-release leaves an existing body
  # untouched when `body` is omitted).
  release-notes:
    name: Release notes (git-cliff)
    needs: tests
    runs-on: [self-hosted, linux]
    outputs:
      # Exposed so the desktop job can embed the same notes in latest.json, which
      # the in-app updater shows in its "update available" prompt.
      notes: ${{ steps.cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git-cliff can build the changelog

      # Render the notes for the just-pushed tag (`--latest`) from cliff.toml.
      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Seed the release body
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.cliff.outputs.content }}

  windows-desktop:
    name: Windows desktop (NSIS .exe)
    needs: release-notes
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # makensis (for NSIS packaging) and mingw-w64 (Windows cross-compiler).
      - name: Install NSIS and mingw-w64
        run: sudo apt-get install -y nsis mingw-w64

      - run: npm ci

      # The tag is the source of truth for the version; stamp it into the
      # configs so the installer is named correctly. Build-time only.
      - name: Sync version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: node .github/scripts/set-version.mjs "$VERSION"

      # NSIS .exe only (skip the WiX .msi). Sign the updater artifacts so the
      # in-app updater accepts them (createUpdaterArtifacts is on in tauri.conf.json).
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis --target x86_64-pc-windows-gnu

      # Assemble the updater manifest (latest.json) from the signed installer +
      # its .sig, pointing at the stable per-tag download URL. The in-app updater
      # polls .../releases/latest/download/latest.json (see tauri.conf.json).
      - name: Generate latest.json
        env:
          VERSION: ${{ github.ref_name }}
          NOTES: ${{ needs.release-notes.outputs.notes }}
        run: node .github/scripts/make-latest-json.mjs "$VERSION"

      - name: Publish installer + latest.json to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*-setup.exe
            latest.json

  android:
    name: Android (unsigned APK)
    needs: release-notes
    runs-on: [self-hosted, linux]
    env:
      # Pin the NDK that the local toolchain is known good with.
      NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages + NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Sync version from tag
        env:
          VERSION: ${{ github.ref_name }}
        run: node .github/scripts/set-version.mjs "$VERSION"

      # Decode the release keystore from secrets and point the Gradle signing
      # config at it (see src-tauri/gen/android/app/build.gradle.kts).
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          EOF

      - run: npm run tauri android build -- --apk

      # Stage the signed APK under a versioned name matching the desktop installer.
      - name: Stage APK with versioned name
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist-apk
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk \
             "dist-apk/Pansutong_${VERSION}_universal.apk"

      - name: Publish APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: dist-apk/*.apk
